<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shailendra Dabral</title>
  <meta name="description" content="Shailendra Dabral: research in astronomy, astrophysics and scientific machine learning. Publications, news, experience and CV.">
  <meta name="author" content="Shailendra Dabral">
  <meta property="og:title" content="Shailendra Dabral">
  <meta property="og:description" content="Research in astronomy, astrophysics and scientific machine learning.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">

  <!-- Apply the saved (or system) theme before the page paints -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("site-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <link rel="stylesheet" href="assets/css/style.css?v=2026-10-09.3">
</head>
<body>
  <a class="skip-link" href="#tiles">Skip to sections</a>

  <div class="start" id="start">
    <header class="start-head">
      <div class="identity">
        <h1 class="name" id="profile-name">Shailendra Dabral</h1>
        <p class="role" id="profile-role"></p>
      </div>
      <div class="head-right">
        <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span class="switch-label">Light mode</span>
        </button>
        <button type="button" class="account" id="account" data-open="about" aria-label="About me">
        <span class="account-text">
          <span class="account-status" id="profile-status"></span>
          <span class="account-affil" id="profile-affiliation"></span>
        </span>
        <img class="account-pic" id="account-pic" src="assets/img/avatar-placeholder.svg" alt="" width="64" height="64">
        </button>
      </div>
    </header>

    <main class="groups" id="tiles" aria-label="Sections"></main>

    <footer class="start-foot">
      <p>&copy; <span id="footer-year">2026</span> <span id="footer-name">Shailendra Dabral</span>. Hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>.</p>
    </footer>
  </div>

  <!-- Section view: opens from a tile, Windows Phone style pivot across the top -->
  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel-inner">
      <div class="panel-head">
        <button type="button" class="back-btn" id="panel-back" aria-label="Back to start">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>
        <nav class="pivot" id="pivot" aria-label="Sections"></nav>
      </div>
      <h2 class="visually-hidden" id="panel-title"></h2>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </dialog>

  <dialog class="cite-dialog" id="cite-dialog" aria-labelledby="cite-title">
    <div class="cite-head">
      <h3 id="cite-title">Cite this paper</h3>
      <button type="button" class="icon-btn" id="cite-close" aria-label="Close">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <pre class="cite-code"><code id="cite-code"></code></pre>
    <div class="cite-foot">
      <span class="cite-status" id="cite-status" aria-live="polite"></span>
      <button type="button" class="btn" id="cite-copy">Copy BibTeX</button>
    </div>
  </dialog>

  <script src="assets/js/content.js?v=2026-10-09.3"></script>
  <script src="assets/js/main.js?v=2026-10-09.3"></script>
</body>
</html>
