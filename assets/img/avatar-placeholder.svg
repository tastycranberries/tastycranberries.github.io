<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="grad-forest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713"/>
      <stop offset="100%" stop-color="#1b2a22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="240" height="240" rx="36" fill="url(#grad-forest)"/>

  <!-- Academic / Botanical Motif in background -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="120" cy="120" r="105"/>
    <ellipse cx="120" cy="120" rx="100" ry="40" transform="rotate(35 120 120)"/>
    <ellipse cx="120" cy="120" rx="100" ry="40" transform="rotate(-35 120 120)"/>
    <circle cx="120" cy="120" r="4" fill="#ffffff"/>
  </g>

  <!-- Researcher Portrait Silhouette Graphic -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Coat -->
    <path d="M 45 235 C 50 175 75 160 120 160 C 165 160 190 175 195 235 Z" fill="url(#coat)"/>
    
    <!-- Shirt / Collar & Tie -->
    <polygon points="120,165 105,190 135,190" fill="#f5f7f4"/>
    <polygon points="120,175 115,225 125,225" fill="#52b788"/>
    
    <!-- Neck -->
    <rect x="108" y="132" width="24" height="24" rx="4" fill="url(#skin)"/>

    <!-- Head -->
    <ellipse cx="120" cy="100" rx="34" ry="42" fill="url(#skin)"/>

    <!-- Academic Glasses -->
    <rect x="92" y="93" width="22" height="15" rx="4" fill="none" stroke="#152219" stroke-width="2.5"/>
    <rect x="126" y="93" width="22" height="15" rx="4" fill="none" stroke="#152219" stroke-width="2.5"/>
    <line x1="114" y1="100" x2="126" y2="100" stroke="#152219" stroke-width="2.5"/>
    <line x1="84" y1="98" x2="92" y2="100" stroke="#152219" stroke-width="2"/>
    <line x1="148" y1="100" x2="156" y2="98" stroke="#152219" stroke-width="2"/>

    <!-- Hair -->
    <path d="M 85 95 C 85 62 100 55 120 55 C 140 55 155 62 155 95 C 148 78 135 72 120 72 C 105 72 92 78 85 95 Z" fill="#152219"/>
  </g>
</svg>
